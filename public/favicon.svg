<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SCRITSHELL orbital S mark</title>
  <desc id="desc">A segmented S formed by two orbital paths and a central signal core.</desc>
  <defs>
    <linearGradient id="orbital" x1="112" y1="92" x2="407" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8C1FF"/>
      <stop offset=".45" stop-color="#7D8CFF"/>
      <stop offset="1" stop-color="#5E69D6"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(256 256) rotate(90) scale(38)">
      <stop stop-color="#F0EDE6"/>
      <stop offset=".36" stop-color="#C7D0FF"/>
      <stop offset="1" stop-color="#7D8CFF"/>
    </radialGradient>
  </defs>
  <g fill="none" stroke="url(#orbital)" stroke-linecap="round" stroke-width="32">
    <path d="M378 124c-50-41-119-61-181-44-70 19-110 78-93 132 16 51 92 71 163 62"/>
    <path d="M135 388c50 41 119 61 181 44 70-19 110-78 93-132-16-51-92-71-163-62"/>
  </g>
  <circle cx="256" cy="256" r="25" fill="url(#core)"/>
  <circle cx="256" cy="256" r="49" fill="none" stroke="#7D8CFF" stroke-opacity=".27" stroke-width="4"/>
  <g fill="#F0EDE6">
    <circle cx="102" cy="173" r="7"/>
    <circle cx="410" cy="339" r="7"/>
  </g>
</svg>
